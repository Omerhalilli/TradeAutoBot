name: AutoTradeBot CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-tests:
    name: Security Scan & Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Automated Secret & Privacy Scanner
        run: |
          python scripts/scan_secrets.py --tracked

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q autotrade/ *.py

      - name: Run Core Test Suite
        env:
          TELEGRAM_BOT_TOKEN: "123456789:dummy_token_for_ci_testing"
          ALLOWED_CHAT_IDS: "123456789"
          ZMQ_SERVER_URL: "tcp://127.0.0.1:5555"
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Portable Configuration Loader
        env:
          TELEGRAM_BOT_TOKEN: "123456789:dummy_token_for_ci_testing"
          ALLOWED_CHAT_IDS: "123456789"
          ZMQ_SERVER_URL: "tcp://127.0.0.1:5555"
        run: |
          python -c "import config; assert config.TELEGRAM_BOT_TOKEN; assert config.ALLOWED_CHAT_IDS == [123456789]; print('CI Config validated successfully.')"
