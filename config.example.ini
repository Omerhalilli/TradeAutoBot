[TELEGRAM]
# Bot token from @BotFather
bot_token = your_telegram_bot_token_here

# Comma-separated list of allowed Telegram user/chat IDs for security
allowed_chat_ids = your_telegram_chat_id_here

# Optional Webhook URL (leave empty for automatic ultra-low-latency polling)
webhook_url = 
webhook_port = 8443
webhook_listen = 0.0.0.0
webhook_secret_token = 

[ZEROMQ]
# ZeroMQ REP server endpoint bound by MT4_ZeroMQ_Bridge EA
server_url = tcp://127.0.0.1:5555

# Timeout in milliseconds for request/response communication
timeout_ms = 3000

[NEWS]
# Lead time in minutes for automated reminders before high-impact events
reminder_lead_minutes = 15

# Comma-separated list of event impact levels to alert on: High, Medium, Low
impact_filter = High,Medium

# User local timezone for displaying scheduled events (IANA format, e.g. UTC, Europe/London, America/New_York)
user_timezone = UTC

# MetaTrader 4 Broker GMT Offset in hours (typically 2 in winter, 3 in summer)
broker_gmt_offset = 2

[AUTOTRADE]
# Maximum autonomous concurrent open positions (conservative default: 1)
max_open_positions = 1

# Per-symbol cooldown guard in minutes after trade (default: 60)
cooldown_minutes = 60

# Minimum confluence score (0-10) to execute autonomous trade (stands on 6 or past 6)
min_score = 6

[RISK]
# Maximum risk percentage of balance/equity per trade (conservative default: 0.5%)
max_account_risk_pct = 0.5

# Maximum daily loss circuit breaker percentage (conservative default: 2.0%)
max_daily_loss_pct = 2.0

# Maximum peak equity drawdown percentage with liquidation & latch halt (conservative default: 10.0%)
max_total_drawdown_pct = 10.0

# Maximum margin utilization allowed (conservative default: 50.0%)
max_margin_usage_pct = 50.0

# Minimum Reward-to-Risk ratio (conservative default: 1.5)
min_risk_reward_ratio = 1.5

# Maximum consecutive losses before cooldown pause (default: 3)
max_consecutive_losses = 3

# Pause duration after max consecutive losses in seconds (default: 1800 = 30m)
consecutive_loss_cooldown_sec = 1800
